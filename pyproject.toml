[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skybox-generator"
version = "0.1.0"
description = "Generate real-terrain equirectangular skyboxes from satellite imagery and SRTM elevation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
]

[project.scripts]
skybox = "skybox.cli:main"

[tool.setuptools]
packages = ["skybox"]